<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d3b66" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="/company-logo.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>Offline — Nsenga Legacy Electronic</title>
    <style>
      :root {
        --brand: #0d3b66;
        --brand-2: #1a6bb0;
        --accent: #f18f01;
        --text: #1d3557;
        --muted: #6b7280;
        --bg: #f8fafc;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 600px at 20% -10%, #dbeafe 0%, transparent 60%),
                    radial-gradient(900px 500px at 110% 10%, #fef3c7 0%, transparent 60%),
                    var(--bg);
        display: flex; align-items: center; justify-content: center; padding: 24px;
      }
      .card {
        background: #fff; border-radius: 20px; padding: 40px 36px; max-width: 520px; width: 100%;
        box-shadow: 0 20px 60px -20px rgba(13, 59, 102, 0.25);
        text-align: center;
      }
      .offline-badge {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 6px 14px; border-radius: 999px;
        background: #fee2e2; color: #991b1b; font-weight: 600; font-size: 13px;
        margin-bottom: 20px;
      }
      .offline-dot {
        width: 8px; height: 8px; border-radius: 50%; background: #ef4444;
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100%{transform:scale(1); opacity:1} 50%{transform:scale(1.5); opacity:.5} }
      h1 {
        margin: 0 0 12px 0; font-size: 28px; font-weight: 800;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 24px 0; font-size: 15px; }
      .logo {
        width: 96px; height: 96px; border-radius: 24px; margin: 0 auto 20px;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        display: flex; align-items: center; justify-content: center; color: #fff;
        font-size: 40px; font-weight: 900; letter-spacing: 1px;
        box-shadow: 0 12px 28px -10px rgba(13, 59, 102, 0.55);
      }
      .hint {
        background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 12px;
        padding: 14px 16px; font-size: 13px; color: #475569; line-height: 1.6;
        text-align: left;
      }
      .hint strong { color: var(--brand); }
      .retry-btn {
        display: inline-block; margin-top: 20px; padding: 12px 22px; border: 0; border-radius: 12px;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
        box-shadow: 0 10px 20px -8px rgba(13, 59, 102, 0.55);
        transition: transform .15s ease, box-shadow .15s ease;
      }
      .retry-btn:hover { transform: translateY(-1px); }
      .retry-btn:active { transform: translateY(0); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">NL</div>
      <span class="offline-badge"><span class="offline-dot"></span> No internet connection</span>
      <h1>You're offline</h1>
      <p>The application can't connect to the server right now. Please check your connection and try again.</p>
      <div class="hint">
        <strong>Tips:</strong><br />
        • Turn off Airplane Mode / turn on Wi-Fi or mobile data<br />
        • Verify your router is connected to the internet<br />
        • Wait a moment and tap <strong>Retry</strong> below
      </div>
      <button class="retry-btn" onclick="location.reload()">↻ Retry connection</button>
    </div>
  </body>
</html>
